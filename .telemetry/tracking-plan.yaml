  "implementation_notes": [
    "Every first-party event has a random event_id and server timestamp, session_id, environment and allowlisted scene.",
    "Unknown fields and arbitrary properties are rejected by the server. No raw URLs, chat text, IPs or user agents are stored in this research schema. Existing host access logs have a separate lifecycle.",
    "Consent version 2026-10-29; no SDK or events before opt-in. Withdrawal deletes first-party session/events/feedback and prevents late requests from recreating them.",
    "Clarity events contain only approved names and categorical tags, not comments, identifiers or question text. Whole application body is masked before SDK load.",
    "Feedback is session-level experience feedback, not a question-linked scientific quality score.",
    "Event transport is best effort; client interruptions, blockers and disabled consent affect denominators. Do not infer unique users or complete operational availability.",
    "Clarity dashboard export is aggregate-only. Manual import uses a server-side token and safe aggregate dimensions. Recordings remain managed in Clarity.",
    "Retention policy is 90 days. Purge tooling is provided; no automatic schedule is created by this change.",
    "PostHog receives explicit approved events only after renewed opt-in. Autocapture, pageview/pageleave, replay, surveys, feature flags and person profiles are disabled. URL/referrer/automatic properties are removed before_send; required public token and separate page-memory anonymous distinct_id are retained.",
    "PostHog and Clarity do not receive first-party session UUIDs. PostHog identity is separate and ephemeral; its counts cannot identify people or link to first-party deletion capabilities.",
    "Native dashboard 1066277 has six validated saved insights. Initial queries have no product data. Public SDK configuration saved for both Render services; publication and real hosted consented capture verification remain separate.",
    "Private /research-dashboard polls first-party Neon every three seconds. Hosted data requires a separate RESEARCH_ADMIN_TOKEN beyond the site gate. Local Release Center administrators can view dev/prod privately.",
    "Stop clears application queues and requests future provider opt-out; already-started provider requests may finish. First-party deletion does not delete already-uploaded provider copies."
  ]

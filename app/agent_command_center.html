<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeatCODE · Agent Command Center</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f5; --surface:#ffffff; --ink:#14201d; --muted:#6b7a75;
  --line:#e4e8e4; --accent:#127a6b; --accent-soft:#e4f2ef; --accent-ink:#0c5a4e;
  --amber:#b7791f; --red:#b4443a; --red-soft:#fbe9e7;
  --radius:13px; --shadow:0 1px 2px rgba(20,32,29,.05),0 6px 20px rgba(20,32,29,.04);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;height:100vh;padding:14px 20px 16px;
  display:flex;flex-direction:column;gap:10px;overflow:hidden}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* header (compact) */
.top{display:flex;align-items:center;gap:11px;flex:none}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.03em;flex:none}
.top h1{font-size:17px}
.top .sub{font-size:11.5px;color:var(--muted);margin-top:0}

.section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;flex:none}

.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;transition:.12s}
.btn:hover{border-color:#cbd3cd;background:#fbfcfb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* compact agent roster */
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px;flex:none}
.agent{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);cursor:pointer;
  position:relative;transition:.12s}
.agent:hover{border-color:#cbd3cd}
.agent.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex:none}
.agent-meta{flex:1;min-width:0}
.agent-name{font-size:13px;font-weight:670;display:flex;align-items:center;gap:6px}
.agent-role{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.s-active{background:#25a06f}.s-idle{background:#c9a227}.s-standby{background:#b0b8b2}
.pick{width:18px;height:18px;border-radius:6px;border:1.6px solid #cdd5cf;flex:none;display:grid;place-items:center;background:#fff}
.pick svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.agent.sel .pick{background:var(--accent);border-color:var(--accent)}
.agent.sel .pick svg{opacity:1}
/* traits popover (hidden; shows on hover/focus) */
.trait-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;display:none;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 30px rgba(20,32,29,.16);
  padding:11px 12px}
.agent:hover .trait-pop,.agent.pop .trait-pop{display:block}
.tp-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:7px}
.traits{display:flex;flex-wrap:wrap;gap:5px}
.trait{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}

/* composer — the tall chat box, high on the screen */
.dispatch{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;position:relative}
.disp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.disp-top h2{font-size:14px}
.selchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.selchip{font-size:11.5px;font-weight:600;padding:4px 9px 4px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;gap:5px}
.selchip .x{cursor:pointer;opacity:.6;font-weight:700}.selchip .x:hover{opacity:1}
.selchip.empty{background:#eef1ee;color:var(--muted)}
.ta-wrap{position:relative;flex:1;min-height:0;display:flex}
textarea{flex:1;min-height:0;width:100%;resize:none;font:inherit;font-size:15px;line-height:1.6;
  padding:16px 60px 16px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--accent);background:#fff}
textarea.drag{border-color:var(--accent);background:#eef7f4}
.mic-in{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(20,32,29,.14);transition:.12s;z-index:5}
.mic-in:hover{border-color:var(--accent);background:#fbfcfb}
.mic-in.rec{background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:32px;padding:0;font-size:15px}
.iconbtn.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,68,58,.5)}50%{box-shadow:0 0 0 7px rgba(180,68,58,0)}}
.hiddenfile{display:none}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;flex:none;align-items:center;max-height:56px;overflow:auto}
.attach-row:empty{display:none}
.att{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:8px;
  background:#eef3f1;border:1px solid var(--line);color:#33413c;max-width:240px}
.att .an{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.att.ref{background:#fbf3e3;border-color:#ecd9a8;color:var(--amber)}
.att .x{cursor:pointer;opacity:.6;font-weight:700}.att .x:hover{opacity:1}

/* footer action bar */
.foot-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex:none;position:relative}
.coordwrap{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.toggle{width:34px;height:20px;border-radius:999px;background:#d7ddd8;position:relative;cursor:pointer;transition:.15s;flex:none}
.toggle.on{background:var(--accent)}
.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on i{left:16px}
.spacer{flex:1}
/* ideas popover */
.ideas-pop{position:absolute;bottom:calc(100% + 8px);left:0;z-index:40;display:none;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(20,32,29,.18);
  padding:11px;width:min(440px,86vw)}
.ideas-pop.show{display:block}
.ideas-pop .ip-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
.ideas-grid{display:flex;flex-wrap:wrap;gap:6px}
.ex{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;background:transparent}
.ex:hover{border-color:var(--accent);color:var(--accent-ink)}

/* preview overlay (fixed — never affects page flow) */
.preview{position:fixed;right:20px;bottom:74px;width:min(520px,90vw);max-height:44vh;overflow:auto;z-index:60;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 16px 40px rgba(20,32,29,.22);display:none}
.preview.show{display:block}
.preview-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;
  padding:10px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;background:var(--surface)}
.preview pre{margin:0;padding:13px;font-size:12px;line-height:1.55;white-space:pre-wrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#2a3a35}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
  transition:.22s;pointer-events:none;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">M</div>
    <div>
      <h1>Agent Command Center</h1>
      <div class="sub">MeatCODE · team orchestration — pick agents, compose a task, copy it into your chat</div>
    </div>
    <button class="btn sm" id="openBrowserBtn" title="Open this dashboard in a full browser tab — the microphone works there" style="margin-left:auto;flex:none">⤢ Open in browser</button>
  </div>

  <div class="section-label">Your team — click to enlist · hover a card for its character</div>
  <div class="agents" id="roster"></div>

  <div class="dispatch">
    <div class="disp-top">
      <h2>Compose a joint task</h2>
      <div class="selchips" id="selChips"></div>
    </div>

    <div class="ta-wrap">
      <textarea id="prompt" placeholder="Describe the problem or task for the selected agents…   🎙️ dictate with the mic, or 📎 Upload files below.&#10;&#10;e.g. Improve the expert map: add several clickable buttons wired to the server/database, and log the changes so the whole team knows what was done."></textarea>
      <button class="mic-in" id="micBtn" title="Dictate — click and speak">🎙️</button>
    </div>
    <input type="file" id="fileInput" class="hiddenfile" multiple>
    <div class="attach-row" id="attachRow"></div>

    <div class="foot-bar">
      <button class="btn sm" id="attachBtn" title="Attach / upload files">📎 Upload</button>
      <button class="btn sm" id="ideasBtn">💡 Ideas</button>
      <div class="coordwrap"><div class="toggle on" id="coordToggle"><i></i></div><span>Coordinator notifies team</span></div>
      <div class="spacer"></div>
      <button class="btn sm" id="genBtn">✨ Suggest</button>
      <button class="btn sm ghost" id="previewBtn">Preview</button>
      <button class="btn sm primary" id="copyBtn">⧉ Copy for chat</button>

      <div class="ideas-pop" id="ideasPop">
        <div class="ip-title">💡 Prompt ideas — loads the text + selects the agents</div>
        <div class="ideas-grid" id="ideas"></div>
      </div>
    </div>

    <div class="preview" id="preview">
      <div class="preview-head"><span>Composed order</span><span class="mono" id="wordCount"></span></div>
      <pre id="previewText"></pre>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ---------- AGENT MODEL — each agent framed by the character of its role ---------- */
const AGENTS = [
  { id:"data", name:"Data Engineer", emoji:"🗄️", color:"#2f6db3", soft:"#e8f0f9",
    role:"Corpus, Neon DB, pipeline, scoring", status:"active", statusTxt:"Active",
    traits:["Rigorous","Precise","Systematic","Data-driven","Reliable","Detail-obsessed"] },
  { id:"ui", name:"UI / UX Designer", emoji:"🎨", color:"#6b52a3", soft:"#efeaf7",
    role:"Mockup, screens, design system", status:"active", statusTxt:"Active",
    traits:["Creative","User-empathetic","Aesthetic","Brand-consistent","Iterative","Detail-oriented"] },
  { id:"algo", name:"Algorithm Expert", emoji:"🧮", color:"#127a6b", soft:"#e0efec",
    role:"Oracle retrieval, RAG, eval", status:"active", statusTxt:"Active",
    traits:["Cautious","Analytical","Experienced","Problem-solver","Artistic taste","Sense for efficiency"] },
  { id:"fullstack", name:"Fullstack Engineer", emoji:"🛠️", color:"#2b8ca6", soft:"#e2f0f4",
    role:"Frontend + backend, deploy, integration", status:"active", statusTxt:"Active",
    traits:["Versatile","Resourceful","End-to-end","Ships fast","Pragmatic","Unblocks anything"] },
  { id:"advisory", name:"Advisory", emoji:"🧭", color:"#7a8a3a", soft:"#eef1e0",
    role:"Strategy, architecture, infra, docs", status:"active", statusTxt:"Active",
    traits:["Strategic","Big-picture","Principled","Clear-thinking","Risk-aware","Candid"] },
  { id:"coord", name:"Project Coordinator", emoji:"🗂️", color:"#b7791f", soft:"#fbf3e3",
    role:"Broadcasts updates & notifies the team", status:"active", statusTxt:"Active",
    traits:["Organized","Communicative","Dependable","Attentive","Proactive","Diplomatic"] }
];

const IDEAS = [
  {label:"Improve expert map", agents:["data","ui"], text:"Improve the expert map in the MeatCODE app: create several new buttons, make them clickable, and wire them to interact with the database through the server (meatcode_server.py / Neon). Data Engineer owns the API + DB side; UI Designer owns the buttons, states and layout. Work simultaneously, then log everything to AGENT_UPDATE_LOG.md."},
  {label:"Deploy the grounded Oracle", agents:["fullstack","algo"], text:"Fullstack Engineer: take the grounded Oracle from working code to reliably deployed — verify /api/ask retrieval + SSE end-to-end on Render, wire any missing env/config, run deploy.command, and confirm the live site. Algorithm Expert: pair on retrieval correctness + the eval so what ships is exactly what was tested."},
  {label:"Ship a feature end-to-end", agents:["fullstack","ui"], text:"Fullstack Engineer + UI Designer: build a new feature end-to-end — UI in the mockup, backend endpoint in meatcode_server.py, wired together with loading/empty/error states, then deployed and verified live."},
  {label:"Promote v9 mockup", agents:["ui","advisory"], text:"Promote the v9 polished mockup to the canonical app/meatcode_mockup.html: UI Designer carries the richer treatment across scenes and promotes the file; Advisory confirms it fits the design-system decision and updates PROJECT_STATE. Log the promotion."},
  {label:"Notify the team", agents:["coord"], text:"Project Coordinator: read AGENT_UPDATE_LOG.md + PROJECT_STATE.md, summarize what every agent did recently, and notify all the agents of the latest so the whole team stays current."},
  {label:"Corpus → 1,000+", agents:["data"], text:"Data Engineer: expand the literature corpus from 818 toward 1,000–2,000 high-value sources — run the taxonomy-driven ingester deeper (including older foundational reviews), dedupe, tag to canonical topics, and re-score priority."},
  {label:"Close quarantine write-back", agents:["data","algo"], text:"Data Engineer + Algorithm Expert: close the quarantine→relevance_llm write-back so Daniel-rejected sources are actually blocked from Oracle retrieval, not just recorded in source_audits. Verify a quarantined source no longer appears in /api/ask results."}
];

/* ---------- STATE ---------- */
const selected = new Set();
let coordOn = true;
const LIVE = typeof window !== "undefined" && window.cowork && typeof window.cowork.askClaude === "function";
const attachments = [];
const TEXT_RE=/\.(txt|md|markdown|csv|tsv|json|ya?ml|js|jsx|ts|tsx|py|rb|go|rs|java|c|cpp|h|html?|css|scss|sql|xml|toml|ini|env|sh|r|tex|log)$/i;
const INLINE_CAP=120*1024;

function statusClass(s){return s==="active"?"s-active":s==="idle"?"s-idle":"s-standby";}

/* ---------- ROSTER ---------- */
function renderRoster(){
  const r = document.getElementById("roster"); r.innerHTML = "";
  AGENTS.forEach(a=>{
    const el = document.createElement("div");
    el.className = "agent" + (selected.has(a.id)?" sel":"");
    el.id = "card-"+a.id;
    const traitsHtml = a.traits.map(t=>`<span class="trait" style="background:${a.soft};color:${a.color}">${t}</span>`).join("");
    el.innerHTML = `
      <div class="av" style="background:${a.soft}">${a.emoji}</div>
      <div class="agent-meta">
        <div class="agent-name">${a.name}<span class="sdot ${statusClass(a.status)}" title="${a.statusTxt}"></span></div>
        <div class="agent-role">${a.role}</div>
      </div>
      <div class="pick"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"></polyline></svg></div>
      <div class="trait-pop"><div class="tp-title">Character</div><div class="traits">${traitsHtml}</div></div>`;
    el.addEventListener("click", ()=>toggleSelect(a.id));
    r.appendChild(el);
  });
}

function toggleSelect(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  document.getElementById("card-"+id).classList.toggle("sel", selected.has(id));
  renderChips(); refreshPreview();
}

function renderChips(){
  const c = document.getElementById("selChips"); c.innerHTML="";
  if(selected.size===0){ c.innerHTML = `<span class="selchip empty">No agents enlisted yet</span>`; return; }
  AGENTS.filter(a=>selected.has(a.id)).forEach(a=>{
    const chip = document.createElement("span"); chip.className="selchip";
    chip.innerHTML = `${a.emoji} ${a.name} <span class="x" data-x="${a.id}">✕</span>`;
    c.appendChild(chip);
  });
  c.querySelectorAll("[data-x]").forEach(x=>x.addEventListener("click",e=>{e.stopPropagation();toggleSelect(x.getAttribute("data-x"));}));
}

/* ---------- IDEAS ---------- */
function renderIdeas(){
  const e=document.getElementById("ideas"); e.innerHTML="";
  IDEAS.forEach(ix=>{
    const b=document.createElement("button"); b.className="ex"; b.textContent="＋ "+ix.label;
    b.addEventListener("click",()=>{
      selected.clear(); ix.agents.forEach(id=>selected.add(id));
      document.getElementById("prompt").value=ix.text;
      renderRoster(); renderChips(); refreshPreview();
      document.getElementById("ideasPop").classList.remove("show");
    });
    e.appendChild(b);
  });
}

/* ---------- SUGGEST (prompt generator) ---------- */
async function generateSuggestion(){
  const specialists=[...selected].filter(id=>id!=="coord");
  if(specialists.length===0){ toast("Select an agent first to get a task idea"); return; }
  const names=AGENTS.filter(a=>selected.has(a.id)).map(a=>a.name);
  const btn=document.getElementById("genBtn");
  const offline=()=>{
    const match=IDEAS.find(ix=>ix.agents.some(a=>specialists.includes(a)))||IDEAS[0];
    document.getElementById("prompt").value=match.text; refreshPreview();
    toast("✨ Suggestion loaded — edit, then Copy for chat");
  };
  if(LIVE && typeof window.cowork.askClaude==="function"){
    btn.disabled=true; const old=btn.textContent; btn.textContent="…";
    try{
      const cur=document.getElementById("prompt").value.trim();
      const instr="You are helping Lior plan work on MeatCODE — a meaty-flavor research platform (literature DB, molecular DB, expert map, Oracle RAG chatbot, product mockup on Render). Propose ONE concrete, high-leverage task these agents can do together, phrased as a crisp instruction naming who owns what (2–4 sentences). Agents: "+names.join(", ")+". "+(cur?("Build on this rough goal: "+cur):"")+" Return ONLY the task instruction text, no preamble.";
      const res=await window.cowork.askClaude(instr, []);
      let out=typeof res==="string"?res:(res&&(res.text||res.answer||res.output||(res.content&&res.content[0]&&res.content[0].text)))||"";
      out=(out||"").trim();
      if(out){ document.getElementById("prompt").value=out; refreshPreview(); toast("✨ Idea generated — review, then Copy for chat"); }
      else offline();
    }catch(e){ offline(); }
    finally{ btn.disabled=false; btn.textContent="✨ Suggest"; }
  } else offline();
}

/* ---------- COMPOSE ---------- */
function composePrompt(){
  const task = document.getElementById("prompt").value.trim();
  const picked = AGENTS.filter(a=>selected.has(a.id) && a.id!=="coord");
  const coordPicked = selected.has("coord") || (coordOn);
  let p = "";
  p += "You are orchestrating my MeatCODE agent team. Work inside the canonical repo `meatCODE/` "
     + "(read CLAUDE.md then PROJECT_STATE.md first). Spawn the following specialist agents to work "
     + "IN PARALLEL on one shared objective, each owning their part:\n\n";
  picked.forEach(a=>{ p += `  • ${a.name} — ${a.role}\n`; });
  if(picked.length===0) p += "  • (no specialist selected — pick at least one)\n";
  p += "\nSHARED OBJECTIVE:\n" + (task || "(see attached files below)") + "\n\n";
  p += attachmentsBlock();
  p += "COORDINATION RULES:\n";
  p += "  1. Split the work so the agents run simultaneously, not sequentially; state who owns what.\n";
  p += "  2. Each agent edits only its area in `meatCODE/`, follows the file-stamp convention, and\n";
  p += "     appends a dated entry to AGENT_UPDATE_LOG.md describing what it changed and why.\n";
  p += "  3. Keep changes consistent with PROJECT_STATE.md; update it if technical reality changes.\n";
  if(coordPicked){
    p += "  4. When the specialists finish, the Project Coordinator consolidates their update-log\n";
    p += "     entries and notifies all the agents of what was just done, so the whole team stays current.\n";
  }
  p += "\nReport back a concise summary of who did what and what's now ready for my review.";
  return p;
}
function refreshPreview(){
  const t = composePrompt();
  document.getElementById("previewText").textContent = t;
  document.getElementById("wordCount").textContent = t.split(/\s+/).filter(Boolean).length + " words";
}

/* ---------- COPY ---------- */
function validate(){
  const specialists = [...selected].filter(id=>id!=="coord");
  const task = document.getElementById("prompt").value.trim();
  if(specialists.length===0){ toast("Enlist at least one agent first"); return false; }
  if(!task && attachments.length===0){ toast("Write a task or attach a file for your agents"); return false; }
  return true;
}
function copyForChat(){
  if(!validate()) return;
  const text = composePrompt();
  const done = ()=>toast("⧉ Copied — paste (⌘V) into your chat to launch");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea"); ta.value=text;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.focus(); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove();
  if(ok){ done(); }
  else{ document.getElementById("preview").classList.add("show"); refreshPreview(); toast("Select the prompt & copy it"); }
}

/* ---------- TOAST ---------- */
let toTimer;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toTimer); toTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ---------- FILE ATTACHMENTS ---------- */
function fmtSize(n){ return n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB"; }
function handleFiles(list){
  [...list].forEach(f=>{
    const isText = TEXT_RE.test(f.name) || (f.type||"").startsWith("text/") || f.type==="application/json";
    if(isText && f.size<=INLINE_CAP){
      const rd=new FileReader();
      rd.onload=()=>{ attachments.push({name:f.name,size:f.size,inline:true,content:String(rd.result||"")}); renderAttach(); refreshPreview(); };
      rd.onerror=()=>{ attachments.push({name:f.name,size:f.size,inline:false,reason:"couldn't read"}); renderAttach(); refreshPreview(); };
      rd.readAsText(f);
    }else{
      attachments.push({name:f.name,size:f.size,inline:false,reason:isText?"too large to inline":"binary — attach in chat"});
      renderAttach(); refreshPreview();
    }
  });
}
function removeAttach(i){ attachments.splice(i,1); renderAttach(); refreshPreview(); }
function renderAttach(){
  const r=document.getElementById("attachRow"); r.innerHTML="";
  attachments.forEach((f,i)=>{
    const el=document.createElement("span"); el.className="att"+(f.inline?"":" ref");
    el.innerHTML=`📄 <span class="an">${f.name}</span> <span style="opacity:.6">${fmtSize(f.size)}${f.inline?"":" · "+f.reason}</span> <span class="x" data-ai="${i}">✕</span>`;
    r.appendChild(el);
  });
  r.querySelectorAll("[data-ai]").forEach(x=>x.addEventListener("click",()=>removeAttach(+x.getAttribute("data-ai"))));
}
function attachmentsBlock(){
  if(!attachments.length) return "";
  let s=""; const inl=attachments.filter(f=>f.inline), refs=attachments.filter(f=>!f.inline);
  if(inl.length){
    s+="ATTACHED FILES (contents inlined below):\n";
    inl.forEach(f=>{ s+=`\n----- FILE: ${f.name} (${fmtSize(f.size)}) -----\n${f.content}\n----- END OF ${f.name} -----\n`; });
    s+="\n";
  }
  if(refs.length){
    s+="ALSO ATTACH THESE FILES DIRECTLY IN THE CHAT (couldn't be inlined here): "+refs.map(f=>f.name+" ("+f.reason+")").join("; ")+".\n\n";
  }
  return s;
}

/* ---------- DICTATION (Web Speech API) ---------- */
let recog=null, listening=false, dictBase="", dictFinal="", srSupported=false;
const BLOCK_MSG="Microphone blocked. On a downloaded file, Safari won’t allow the mic — open this page in Google Chrome, or ask me to host it over https (works in any browser). Also check the browser’s mic permission for this page.";

/* ---------- OPEN IN A REAL BROWSER TAB ---------- */
function openInBrowser(){
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([html], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  // 1) try a real new tab (works in web browsers that allow popups)
  let win=null; try{ win = window.open(url, "_blank"); }catch(e){ win=null; }
  if(win){ toast("Opened in a new tab — the microphone works there."); setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},60000); return; }
  // 2) fallback: download the standalone page (popups are blocked in the desktop app)
  try{
    const a=document.createElement("a"); a.href=url; a.download="MeatCODE_Command_Center.html";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Popups are blocked here — downloaded the page instead. Open the downloaded file in Chrome/Safari; the mic works there.");
    setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},60000);
  }catch(e){
    toast("Couldn’t open or download from here — the same page is saved in your repo at app/agent_command_center.html; open it in a browser.");
  }
}
function initDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  srSupported = !!SR;
  const micBtn = document.getElementById("micBtn");
  micBtn.addEventListener("click", toggleDict);  // always clickable — explains itself if it can't run
  if(!SR) return;
  recog = new SR(); recog.continuous=true; recog.interimResults=true; recog.lang="en-US";
  recog.onresult=(e)=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal){ dictFinal += (dictFinal && !/\s$/.test(dictFinal)?" ":"") + res[0].transcript.trim(); }
      else interim += res[0].transcript;
    }
    const ta=document.getElementById("prompt");
    const base = dictBase ? (/\s$/.test(dictBase)?dictBase:dictBase+" ") : "";
    ta.value = base + dictFinal + (interim?(" "+interim):"");
    refreshPreview();
  };
  recog.onerror=(e)=>{
    stopDict();
    if(e.error==="not-allowed"||e.error==="service-not-allowed") toast(BLOCK_MSG);
    else if(e.error==="no-speech") toast("No speech detected — tap the mic and speak.");
    else if(e.error==="audio-capture") toast("No microphone found on this device.");
    else toast("Dictation error ("+e.error+").");
  };
  recog.onend=()=>{ if(listening){ try{ recog.start(); }catch(_){} } };
}
function toggleDict(){
  if(listening){ stopDict(); return; }
  if(!srSupported){ toast("Dictation needs Chrome or Safari (Web Speech API). Open this page in one of those, or ask me to host it over https."); return; }
  startDict();  // let the browser show its own mic/speech permission prompt (don't gate on getUserMedia — Safari blocks it on file://)
}
function startDict(){
  const ta=document.getElementById("prompt"); dictBase=ta.value; dictFinal="";
  listening=true; document.getElementById("micBtn").classList.add("rec");
  try{ recog.start(); toast("🎙️ Listening… tap the mic again to stop"); }
  catch(e){ /* start() can throw if already running — ignore */ }
}
function stopDict(){ listening=false; try{ recog && recog.stop(); }catch(e){} const m=document.getElementById("micBtn"); if(m) m.classList.remove("rec"); }

renderRoster(); renderChips(); renderIdeas(); refreshPreview();
document.getElementById("prompt").addEventListener("input", refreshPreview);
document.getElementById("coordToggle").addEventListener("click",function(){
  coordOn=!coordOn; this.classList.toggle("on",coordOn); refreshPreview();
});
document.getElementById("copyBtn").addEventListener("click", copyForChat);
document.getElementById("genBtn").addEventListener("click", generateSuggestion);
initDictation();
document.getElementById("openBrowserBtn").addEventListener("click", openInBrowser);
document.getElementById("attachBtn").addEventListener("click", ()=>document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", e=>{ handleFiles(e.target.files); e.target.value=""; });
(function(){
  const ta=document.getElementById("prompt");
  ["dragenter","dragover"].forEach(ev=>ta.addEventListener(ev,e=>{ e.preventDefault(); ta.classList.add("drag"); }));
  ["dragleave","dragend"].forEach(ev=>ta.addEventListener(ev,e=>{ e.preventDefault(); ta.classList.remove("drag"); }));
  ta.addEventListener("drop",e=>{ e.preventDefault(); ta.classList.remove("drag"); if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
})();
document.getElementById("ideasBtn").addEventListener("click", e=>{
  e.stopPropagation(); document.getElementById("ideasPop").classList.toggle("show");
});
document.getElementById("previewBtn").addEventListener("click", e=>{
  e.stopPropagation(); const p=document.getElementById("preview");
  p.classList.toggle("show"); if(p.classList.contains("show")) refreshPreview();
});
document.addEventListener("click", e=>{
  if(!e.target.closest("#ideasPop") && e.target.id!=="ideasBtn") document.getElementById("ideasPop").classList.remove("show");
});

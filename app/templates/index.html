<!DOCTYPE html>
<!-- Last updated: 2026-07-05 · deploy-templates session · self-populating gallery; served by meatcode_server.py at /templates/ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeatCODE — Template Gallery</title>
<style>
  :root {
    --bg: #FAF6EF; --bg-deep: #F2EBDA;
    --wine: #00736E; --wine-deep: #015A56; --wine-mist: #E0F0EE;
    --ink: #1A1A1A; --ink-dim: #4A4A4A; --ink-faint: #8A8A8A;
    --surface: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 48px 24px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  h1 { color: var(--wine); font-size: 26px; letter-spacing: 0.01em; }
  .status { font-size: 13px; }
  .sub { color: var(--ink-dim); font-size: 14px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.card {
    display: block; background: var(--surface); border: 1px solid var(--bg-deep);
    border-radius: 12px; padding: 20px; text-decoration: none; color: var(--ink);
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--wine); transform: translateY(-2px); }
  a.card .name { font-weight: 700; color: var(--wine-deep); margin-bottom: 6px; }
  a.card .file { font-size: 12px; color: var(--ink-faint); font-family: ui-monospace, monospace; }
  .empty {
    background: var(--wine-mist); border-radius: 12px; padding: 28px;
    color: var(--ink-dim); font-size: 14px; line-height: 1.6;
  }
  .empty code { background: var(--surface); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MeatCODE · Template Gallery</h1>
    <span class="status" data-mc-health></span>
  </header>
  <p class="sub">Every page in <code>app/templates/</code> is served here and can talk to the
     MeatCODE server (Claude + Neon) via <code>meatcode-api.js</code>.</p>
  <div class="grid" id="grid"></div>
</div>
<script src="meatcode-api.js"></script>
<script>
  fetch(MeatCODE.API_BASE + '/api/templates')
    .then(function (r) { return r.json(); })
    .then(function (templates) {
      var grid = document.getElementById('grid');
      if (!templates.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No templates deployed yet. ' +
          'Export your Claude Design templates as HTML and drop them into ' +
          '<code>app/templates/</code> — they appear here automatically. ' +
          'See <code>README.md</code> in that folder for how to wire elements to Claude.</div>';
        return;
      }
      grid.innerHTML = templates.map(function (t) {
        return '<a class="card" href="' + t.url + '">' +
          '<div class="name">' + MeatCODE.escapeHTML(t.name) + '</div>' +
          '<div class="file">' + MeatCODE.escapeHTML(t.file) + '</div></a>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('grid').innerHTML =
        '<div class="empty" style="grid-column:1/-1">Server unreachable — start it with ' +
        '<code>run_oracle.command</code> and reload.</div>';
    });
</script>
</body>
</html>

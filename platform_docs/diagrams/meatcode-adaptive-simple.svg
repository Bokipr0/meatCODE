<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" font-family="Avenir Next,Helvetica,Arial,sans-serif">
<!-- Updated 2026-10-26 · Advisory · Simplified review design. Supporting services grouped. -->
<title>MeatCODE — from papers to personalized answers</title>
<desc>Nine objects. Papers flow through GROBID, local Qwen and validation into Neon knowledge. Oracle uses retrieval and cloud GPT to answer. A separate user memory loop supplies context.</desc>
<defs>
<marker id="t" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#008680"/></marker>
<marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#B58B20"/></marker>
<marker id="p" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#80658E"/></marker>
<style>.name{font-size:23px;font-weight:700;fill:#153C40;text-anchor:middle}.sub{font-size:17px;fill:#607174;text-anchor:middle}.label{font-size:16px;fill:#607174;text-anchor:middle}.flow{fill:none;stroke:#008680;stroke-width:3;marker-end:url(#t);stroke-linejoin:round}.ask{fill:none;stroke:#B58B20;stroke-width:3;marker-end:url(#g);stroke-linejoin:round}.mem{fill:none;stroke:#80658E;stroke-width:3;marker-end:url(#p);stroke-linejoin:round}</style>
<g id="paper"><path d="M-24-33H12L28-17V33H-24Z" fill="white"/><path d="M-12-7H15M-12 5H15M-12 17H7" stroke="currentColor" stroke-width="3"/></g>
<g id="db"><path d="M-29-22V24C-29 39 29 39 29 24V-22" fill="white" stroke="currentColor" stroke-width="3"/><ellipse cy="-22" rx="29" ry="11" fill="white" stroke="currentColor" stroke-width="3"/><path d="M-29 1C-29 16 29 16 29 1" fill="none" stroke="currentColor" stroke-width="3"/></g>
<g id="network" fill="currentColor" stroke="currentColor" stroke-width="3"><path d="M-24-15L20-25L25 22L-17 29Z M-24-15L25 22" fill="none"/><circle cx="-24" cy="-15" r="6"/><circle cx="20" cy="-25" r="6"/><circle cx="25" cy="22" r="6"/><circle cx="-17" cy="29" r="6"/></g>
</defs>
<rect width="1800" height="1050" fill="#FAF7F0"/>
<text x="65" y="72" font-size="42" font-weight="750" fill="#153C40">MeatCODE knowledge architecture</text>
<text x="65" y="110" font-size="20" fill="#607174">Understand the science. Remember the user. Improve the next answer.</text>
<rect x="45" y="155" width="1710" height="320" rx="30" fill="#EEF3E7"/>
<text x="75" y="192" font-size="15" font-weight="700" fill="#63784F">1 · BUILD THE KNOWLEDGE</text>
<path d="M246 292H454" class="flow"/><path d="M586 292H794" class="flow"/><path d="M926 292H1134" class="flow"/><path d="M1266 292H1474" class="flow"/>
<text x="350" y="272" class="label">parse</text><text x="690" y="272" class="label">clean text</text><text x="1030" y="272" class="label">proposed claims</text><text x="1370" y="272" class="label">approved evidence</text>
<g transform="translate(180 292)" color="#768F53"><circle r="62" fill="#DFE8D1"/><use href="#paper"/></g>
<text x="180" y="390" class="name">Scientific papers</text><text x="180" y="420" class="sub">PDFs and sources</text>
<g transform="translate(520 292)" color="#768F53"><circle r="62" fill="#DFE8D1"/><use href="#paper" transform="translate(8 -7)"/><use href="#paper" transform="translate(-8 7)"/></g>
<text x="520" y="390" class="name">GROBID</text><text x="520" y="420" class="sub">Prepare structured text</text>
<g transform="translate(860 292)" color="#C86748"><circle r="62" fill="#F8E3DB"/><use href="#network"/></g>
<text x="860" y="390" class="name">M1 · Qwen</text><text x="860" y="420" class="sub">Extract locally on PC</text>
<g transform="translate(1200 292)"><circle r="62" fill="#F8E3DB"/><path d="M0-38L31-25V0Q30 26 0 40Q-30 26-31 0V-25Z" fill="white"/><path d="M-17-1L-3 14L20-16" fill="none" stroke="#C86748" stroke-width="5"/></g>
<text x="1200" y="390" class="name">Validation · M2 + human</text><text x="1200" y="420" class="sub">Check and curate</text>
<g transform="translate(1540 292)" color="#008680"><circle r="62" fill="#D9EEEA"/><use href="#db"/></g>
<text x="1540" y="390" class="name">Knowledge · Neon</text><text x="1540" y="420" class="sub">Active + reserve evidence</text>

<rect x="45" y="520" width="1710" height="465" rx="30" fill="#E9F4F3"/>
<text x="75" y="557" font-size="15" font-weight="700" fill="#008680">2 · ANSWER AND ADAPT</text>
<path d="M1540 448V592" class="flow"/><text x="1600" y="500" class="label">evidence</text>
<path d="M246 635H1470" class="ask"/><text x="825" y="618" class="label">question + relevant user context</text>
<path d="M1474 700H926" class="ask"/><text x="1190" y="683" class="label">selected evidence</text>
<path d="M794 700H246" class="ask"/><text x="510" y="683" class="label">cited answer</text>
<g transform="translate(180 670)"><circle r="62" fill="#FFF0C9"/><rect x="-35" y="-29" width="70" height="48" rx="10" fill="white"/><path d="M-20 18L-27 34L-2 18" fill="white"/><path d="M-21-13H21M-21 0H12" stroke="#B58B20" stroke-width="4"/></g>
<text x="180" y="768" class="name">Oracle + API</text><text x="180" y="798" class="sub">Ask, answer and coordinate</text>
<g transform="translate(860 700)"><circle r="62" fill="#F8E3DB"/><path d="M-32 14C-47-10-25-35-4-25C9-46 43-30 36-8C53 4 41 29 22 28H-21C-38 28-42 21-32 14" fill="white"/><path d="M-20 4Q0-23 21 4M-13 16Q2 1 16 17" fill="none" stroke="#C86748" stroke-width="4"/></g>
<text x="860" y="798" class="name">M3 · GPT</text><text x="860" y="828" class="sub">Reason in the cloud</text>
<g transform="translate(1540 670)" color="#008680"><circle r="62" fill="#D9EEEA"/><circle cx="-7" cy="-8" r="25" fill="white" stroke="#008680" stroke-width="4"/><path d="M12 12L34 34" stroke="#008680" stroke-width="6"/><use href="#network" transform="translate(-7 -8) scale(.48)"/></g>
<text x="1540" y="768" class="name">Hybrid retrieval</text><text x="1540" y="798" class="sub">Keywords + vectors + graph</text>

<path d="M180 830V900H463" class="mem"/><text x="310" y="882" class="label">useful feedback</text>
<path d="M525 844V825H310V715H246" class="mem"/>
<text x="405" y="815" class="label">remembered context</text>
<g transform="translate(525 900)" color="#80658E"><circle r="55" fill="#E9E0EF"/><use href="#db" transform="scale(.8)"/></g>
<text x="630" y="891" font-size="23" font-weight="700" fill="#153C40">User memory · Neon</text>
<text x="630" y="920" font-size="17" fill="#607174">Save and update goals, preferences and constraints</text>
<text x="75" y="1023" font-size="15" fill="#607174">Review draft · User memory is separate from scientific evidence. Supporting services are grouped, not removed. · 26 Oct 2026</text>
</svg>

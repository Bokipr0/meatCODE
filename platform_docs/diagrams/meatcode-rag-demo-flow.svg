<rect x="278" y="1120" width="237" height="30" rx="5" fill="#f1eee6" />
<text x="396" y="1140" class="status" text-anchor="middle" style="fill:#986d30">SSE ANSWER + CITATIONS</text>
<rect x="58" y="1200" width="1804" height="138" rx="22" fill="#173f39" />
<text x="85" y="1239" class="eyebrow" style="fill:#a9c6bb">03 / BENCHMARK THE WHOLE CONFIGURATION</text>
<text x="85" y="1280" class="lane" style="fill:#fff">Same question. Same model. Same evidence budget.</text>
<text x="85" y="1310" class="body" style="fill:#c7d9d0">Direct model  →  vector-only RAG  →  graph + vector RAG     |     Then compare GPT and Claude with fixed retrieval.</text>
<text x="1450" y="1267" class="status" style="fill:#c7d9d0">QUALITY · CITATIONS · LATENCY</text>
<text x="1450" y="1295" class="status" style="fill:#c7d9d0">COST · COVERAGE · GRAPH VALUE</text>
<text x="82" y="1377" class="small" >LIVE DEV: graph + pgvector imported; semantic retrieval verified. Answer generation awaits Claude credential repair.</text>
<text x="1840" y="1377" class="small" text-anchor="end">Teal: knowledge   /   Gold: query and answer</text>

<!-- Last updated: 2026-10-18 10:00 UTC · Codex / Design-RAG · existing extraction versus prepared Neon demo. -->
<title id="title">MeatCODE — from extracted knowledge to a cited answer</title>
<desc id="desc">Two distinct flows: prepare knowledge asynchronously; answer user questions interactively. The graph and its original vectors are imported into Neon dev and semantic retrieval is verified. The relevance cutoff is removed in local code. Claude is retained with credential repair pending. Benchmark detail is separate from the overview.</desc>
<defs><style>
text{font-family:'Avenir Next','Helvetica Neue',sans-serif;fill:#193e3b}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2.3px;fill:#58716b}
.title{font-size:49px;font-weight:650;letter-spacing:-1.5px}
.sub{font-size:20px;fill:#637671}
.lane{font-size:23px;font-weight:650;letter-spacing:-.4px}
.head{font-size:24px;font-weight:650;letter-spacing:-.6px}
.body{font-size:18px;fill:#526b64}
.small{font-size:14px;fill:#637671}
.status{font-size:11px;font-weight:750;letter-spacing:1.25px}
.label{font-size:14px;font-weight:600;fill:#59746c}
.card{fill:#fff;stroke:#d4e0d9;stroke-width:1.3}
.build{fill:none;stroke:#087f75;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#teal)}
.query{fill:none;stroke:#b17b2e;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#gold)}
.pending{stroke-dasharray:6 7}
</style>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#087f75"/></marker>
<marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#b17b2e"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#c7d7cd"/></pattern>
</defs>
<rect width="1920" height="1420" fill="#f7f7f0"/>
<rect x="1250" y="0" width="670" height="180" fill="url(#dots)" opacity=".6"/>

<text x="80" y="59" class="eyebrow" >MEATCODE / SYSTEM DESIGN</text>
<text x="80" y="126" class="title" >From extracted knowledge to a cited answer.</text>
<text x="82" y="164" class="sub" >One knowledge source. Two separate flows. Every answer traces back to a paper.</text>
<text x="1840" y="59" class="eyebrow" text-anchor="end">18 OCT 2026</text>
<rect x="58" y="220" width="1804" height="426" rx="24" fill="#edf2e9" />
<text x="85" y="265" class="eyebrow" >01</text>
<text x="135" y="269" class="lane" >Prepare the knowledge</text>
<text x="1832" y="265" class="eyebrow" text-anchor="end">ASYNCHRONOUS · NOT PART OF A USER REQUEST</text>
<rect x="85" y="310" width="360" height="206" rx="18" fill="#fff" class="card"/>
<rect x="107" y="332" width="139" height="24" rx="12" fill="#e4f1e9" />
<text x="117" y="348" class="status" style="fill:#26684f">EXTRACTION EXISTS</text>
<text x="419" y="350" class="eyebrow" text-anchor="end">A</text>
<text x="107" y="398" class="head" >Parse &amp; extract</text>
<text x="107" y="428" class="body" >GROBID → LightRAG</text>
<text x="107" y="466" class="small" >3 papers · 194 source chunks</text>
<text x="107" y="490" class="small" >3,418 entities · 4,164 relationships</text>
<rect x="510" y="310" width="360" height="206" rx="18" fill="#fff" class="card"/>
<rect x="532" y="332" width="153" height="24" rx="12" fill="#f4e9d4" />
<text x="542" y="348" class="status" style="fill:#886020">IMPORT CHECKS READY</text>
<text x="844" y="350" class="eyebrow" text-anchor="end">B</text>
<text x="532" y="398" class="head" >Check &amp; map</text>
<text x="532" y="428" class="body" >Evidence → canonical source IDs</text>
<text x="532" y="466" class="small" >DOI mapping + vector/provenance checks</text>
<text x="532" y="490" class="small" >Scientific review remains a distinct step</text>
<rect x="935" y="310" width="360" height="206" rx="18" fill="#fff" class="card"/>
<rect x="957" y="332" width="153" height="24" rx="12" fill="#e4f1e9" />
<text x="967" y="348" class="status" style="fill:#26684f">IMPORTED + VERIFIED</text>
<text x="1269" y="350" class="eyebrow" text-anchor="end">C</text>
<text x="957" y="398" class="head" >Store the graph</text>
<text x="957" y="428" class="body" >Neon Postgres</text>
<text x="957" y="466" class="small" >Entities + relations + evidence links</text>
<text x="957" y="490" class="small" >Demo records retain “extracted” status</text>
<rect x="1360" y="310" width="470" height="206" rx="18" fill="#fff" class="card"/>
<rect x="1382" y="332" width="153" height="24" rx="12" fill="#e4f1e9" />
<text x="1392" y="348" class="status" style="fill:#26684f">IMPORTED + VERIFIED</text>
<text x="1804" y="350" class="eyebrow" text-anchor="end">D</text>
<text x="1382" y="398" class="head" >Index the knowledge</text>
<text x="1382" y="428" class="body" >pgvector in the same Neon database</text>
<text x="1382" y="466" class="small" >7,582 existing entity/relation vectors</text>
<text x="1382" y="490" class="small" >BGE-M3 · 1,024 dimensions · cosine search</text>
<path d="M450 411H503" class="build"/>
<text x="477.5" y="389" class="label" text-anchor="middle">verify</text>
<path d="M875 411H928" class="build"/>
<text x="902.5" y="389" class="label" text-anchor="middle">import</text>
<path d="M1300 411H1353" class="build"/>
<text x="1327.5" y="389" class="label" text-anchor="middle">index</text>
<rect x="85" y="548" width="1745" height="68" rx="12" fill="#e3eae0" />
<text x="108" y="575" class="eyebrow" >SOURCE ARTIFACTS IN THIS DEMO</text>
<text x="108" y="599" class="small" >PDFs, TEI and exact source text stay local.</text>
<text x="670" y="575" class="eyebrow" >EXISTING EMBEDDINGS</text>
<text x="670" y="599" class="small" >Reuse the original vectors; embed again only when text/model changes.</text>
<text x="1422" y="575" class="eyebrow" >TARGET INGESTION</text>
<text x="1422" y="599" class="small" >Qwen extraction → independent validation</text>
<text x="82" y="703" class="lane" >No relevance-score cutoff</text>
<text x="82" y="733" class="body" >Removed in local Oracle code at Lior’s request.</text>
<rect x="58" y="790" width="1804" height="366" rx="24" fill="#f1eee6" />
<path d="M1115 516V533H1325V686H1020V865" class="build"/>
<path d="M1595 516V532H1845V715H1165V865" class="build"/>
<rect x="996" y="737" width="216" height="32" rx="7" fill="#f7f7f0" />
<text x="1104" y="759" class="label" text-anchor="middle">graph + vector evidence</text>
<text x="85" y="828" class="eyebrow" >02</text>
<text x="135" y="832" class="lane" >Answer a question</text>
<text x="1832" y="828" class="eyebrow" text-anchor="end">INTERACTIVE · ONLY RETRIEVAL + REASONING</text>
<rect x="85" y="872" width="310" height="206" rx="18" fill="#fff" class="card"/>
<rect x="107" y="894" width="125" height="24" rx="12" fill="#eef0ed" />
<text x="117" y="910" class="status" style="fill:#6c7c73">USER EXPERIENCE</text>
<text x="369" y="912" class="eyebrow" text-anchor="end">1</text>
<text x="107" y="960" class="head" >Ask in Oracle</text>
<text x="107" y="990" class="body" >User question + context</text>
<text x="107" y="1028" class="small" >The existing platform interface</text>
<text x="107" y="1052" class="small" >Citations link to source records</text>
<rect x="465" y="872" width="310" height="206" rx="18" fill="#fff" class="card"/>
<rect x="487" y="894" width="104" height="24" rx="12" fill="#e4f1e9" />
<text x="497" y="910" class="status" style="fill:#26684f">EXISTING API</text>
<text x="749" y="912" class="eyebrow" text-anchor="end">2</text>
<text x="487" y="960" class="head" >Handle the request</text>
<text x="487" y="990" class="body" >MeatCODE server</text>
<text x="487" y="1028" class="small" >POST /api/ask</text>
<text x="487" y="1052" class="small" >Authentication + streamed response</text>
<rect x="845" y="872" width="410" height="206" rx="18" fill="#fff" class="card"/>
<rect x="867" y="894" width="181" height="24" rx="12" fill="#e4f1e9" />
<text x="877" y="910" class="status" style="fill:#26684f">SEMANTIC QUERY VERIFIED</text>
<text x="1229" y="912" class="eyebrow" text-anchor="end">3</text>
<text x="867" y="960" class="head" >Retrieve evidence</text>
<text x="867" y="990" class="body" >Query embedding + graph context</text>
<text x="867" y="1028" class="small" >BGE-M3 query via local Ollama → Neon</text>
<text x="867" y="1052" class="small" >Bounded evidence pack with source IDs</text>
<rect x="1325" y="872" width="505" height="206" rx="18" fill="#fff" class="card"/>
<rect x="1347" y="894" width="181" height="24" rx="12" fill="#f4e9d4" />
<text x="1357" y="910" class="status" style="fill:#886020">CLAUDE KEY NEEDS REPAIR</text>
<text x="1804" y="912" class="eyebrow" text-anchor="end">4</text>
<text x="1347" y="960" class="head" >Reason &amp; cite</text>
<text x="1347" y="990" class="body" >Hosted answer model</text>
<text x="1347" y="1028" class="small" >Claude kept configured at Lior’s request</text>
<text x="1347" y="1052" class="small" >User will repair the rejected API credential</text>

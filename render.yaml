# Render Blueprint — one-click always-on deploy of the MeatCODE Oracle.
# In Render:  New +  →  Blueprint  →  connect the Bokipr0/meatCODE repo  →  it reads this file.
# Then paste your two secret values when prompted. Every push to the branch auto-redeploys.
services:
  - type: web
    name: meatcode-oracle
    runtime: python
    plan: starter              # ~$7/mo — ALWAYS ON, no idle spin-down / cold starts.
                               # (Revert to "free" only if you accept ~30-60s wake delays.)
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server/meatcode_server.py
    healthCheckPath: /api/health   # Render pings this; auto-restarts the service if it stops responding
                                   # (endpoint stays open even with the password gate on)
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # you paste the value in the Render dashboard — never in the repo
      - key: DATABASE_URL
        sync: false
      - key: SITE_PASSWORD      # shared password gate — REQUIRED for the site to be private.
        sync: false            # paste a strong password in the Render dashboard (not in the repo).
      - key: SITE_USER          # username people type alongside the password
        value: meatcode         # not secret; change if you like
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: prod          # this is the PUBLIC site. The meatcode-dev service sets APP_ENV=dev instead.
      # ── Maillard chemistry simulator (feature flag: maillard_sim) ──
      # `mock` = deterministic, clearly-labelled synthetic output; NOTHING real is called.
      # Leave it at mock until the maillard-sim service below is actually enabled; then set
      # MAILLARD_MODE=http and uncomment the MAILLARD_URL block underneath it.
      - key: MAILLARD_MODE
        value: mock
      # - key: MAILLARD_URL          # ← uncomment together with the maillard-sim service below
      #   fromService:
      #     type: pweb
      #     name: maillard-sim
      #     property: hostport       # Render's private network address, e.g. maillard-sim:10000
      #                              # (private service → not reachable from the internet; only
      #                              #  meatcode-oracle can call it, which is the point: the
      #                              #  browser always goes through /api/simulate on this service)


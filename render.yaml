# Render Blueprint — one-click always-on deploy of the MeatCODE Oracle.
# In Render:  New +  →  Blueprint  →  connect the Bokipr0/meatCODE repo  →  it reads this file.
# Then paste your two secret values when prompted. Every push to the branch auto-redeploys.
services:
  - type: web
    name: meatcode-oracle
    runtime: python
    plan: starter              # ~$7/mo — ALWAYS ON, no idle spin-down / cold starts.
                               # (Revert to "free" only if you accept ~30-60s wake delays.)
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server/meatcode_server.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # you paste the value in the Render dashboard — never in the repo
      - key: DATABASE_URL
        sync: false
      - key: SITE_PASSWORD      # shared password gate — REQUIRED for the site to be private.
        sync: false            # paste a strong password in the Render dashboard (not in the repo).
      - key: SITE_USER          # username people type alongside the password
        value: meatcode         # not secret; change if you like
      - key: PYTHON_VERSION
        value: 3.12.4
